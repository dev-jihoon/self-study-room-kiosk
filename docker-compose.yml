# 좌석 배정 서버 + HTTPS(Caddy). OCI와 UNO Q에서 똑같이 쓴다.
# 직접 실행하지 말고 ./deploy.sh 로 띄운다 (.env를 만들어 줌).
# Nginx Proxy Manager가 있는 서버에서는 ./deploy.sh npm 으로 app만 띄우고 Caddy는 쓰지 않는다.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      TZ: ${TZ:-Asia/Seoul}
      ADMIN_PIN: ${ADMIN_PIN:-0000}
      DEMO_MODE: ${DEMO_MODE:-1}
      EVENTS_TOKEN: ${EVENTS_TOKEN:-}
    volumes:
      - ./data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      CADDY_TLS: ${CADDY_TLS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
