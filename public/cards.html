<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시연용 카드</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { height: auto; min-height: 100%; background: var(--gray100); user-select: text; }
  .bar { max-width: 900px; margin: 0 auto; padding: 28px 24px 8px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; }
  .bar h1 { margin: 0; font-size: 28px; }
  .bar p { margin: 6px 0 0; color: var(--gray500); font-size: 16px; }
  .bar__right { display: flex; gap: 14px; align-items: center; }
  .only { display: flex; gap: 8px; align-items: center; font-size: 15px; color: var(--gray700); cursor: pointer; }
  .only input { width: 18px; height: 18px; accent-color: var(--blue); }
  .sheet-a4 { display: grid; grid-template-columns: repeat(2, 85.6mm); gap: 6mm 8mm; justify-content: center; padding: 8mm 0 16mm; }
  .card {
    width: 85.6mm; height: 54mm; background: #fff; border-radius: 3.2mm; padding: 4.5mm 5mm 4mm;
    display: flex; flex-direction: column; justify-content: space-between; break-inside: avoid;
    box-shadow: 0 0 0 0.25mm #d1d6db;
  }
  .card__top { display: flex; justify-content: space-between; align-items: center; font-size: 8.5pt; color: #8b95a1; }
  .card__demo { color: #3182f6; font-weight: 700; }
  .card__name { font-size: 17pt; font-weight: 700; color: #191f28; line-height: 1.1; }
  .card__id { font-size: 10pt; color: #4e5968; margin-top: 1mm; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  .card svg { display: block; width: 100%; height: 13mm; }
  @media print {
    body { background: #fff; }
    .bar { display: none; }
    @page { size: A4; margin: 10mm; }
    .sheet-a4 { padding: 0; }
  }
</style>
</head>
<body>
<div class="bar">
  <div>
    <h1>시연용 카드</h1>
    <p>A4 한 장에 8장씩 나와요. 학번이 바코드로 들어가 있어요.</p>
  </div>
  <div class="bar__right">
    <label class="only" for="only-night"><input type="checkbox" id="only-night" checked>야자 신청한 학생만</label>
    <button class="btn btn--primary btn--small" id="print" type="button">인쇄하기</button>
  </div>
</div>
<div class="sheet-a4" id="sheet"></div>
<script src="js/core.js"></script>
<script src="js/store.js"></script>
<script src="js/code128.js"></script>
<script>
(async function () {
  const store = await window.KioskStore.open();
  const NS = 'http://www.w3.org/2000/svg';
  function draw() {
    const only = document.getElementById('only-night').checked;
    const list = store.state.roster.filter((s) => !only || (s.days || []).length > 0);
    const sheet = document.getElementById('sheet');
    sheet.innerHTML = '';
    list.forEach((s) => {
      const c = document.createElement('div');
      c.className = 'card';
      c.innerHTML = '<div class="card__top"><span>자기주도학습실</span><span class="card__demo">시연용</span></div>'
        + '<div><div class="card__name"></div><div class="card__id"></div></div>';
      c.querySelector('.card__name').textContent = s.name;
      c.querySelector('.card__id').textContent = s.id;
      c.appendChild(window.Code128.draw(document.createElementNS(NS, 'svg'), s.id));
      sheet.appendChild(c);
    });
  }
  document.getElementById('only-night').addEventListener('change', draw);
  document.getElementById('print').addEventListener('click', () => window.print());
  draw();
})();
</script>
</body>
</html>
