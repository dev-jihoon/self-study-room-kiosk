<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시연용 카드</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { height: auto; background: #fff; user-select: text; }
  .bar { padding: 16px 20px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--line); }
  .bar p { margin: 0; color: var(--muted); font-size: 14px; }
  .sheet { display: grid; grid-template-columns: repeat(2, 85.6mm); gap: 6mm 8mm; justify-content: center; padding: 10mm 0; }
  .card {
    width: 85.6mm; height: 54mm; border: 0.3mm solid #9aa0a8; border-radius: 3mm; padding: 4mm 5mm;
    display: flex; flex-direction: column; justify-content: space-between; break-inside: avoid;
  }
  .card__top { display: flex; justify-content: space-between; align-items: baseline; }
  .card__kind { font-size: 9pt; color: #555; }
  .card__demo { font-size: 8pt; color: #b4372f; font-weight: 700; border: 0.3mm solid #b4372f; border-radius: 1mm; padding: 0 1.5mm; }
  .card__name { font-size: 16pt; font-weight: 700; }
  .card__id { font-size: 10pt; color: #333; font-variant-numeric: tabular-nums; }
  .card svg { width: 100%; height: 15mm; }
  @media print {
    .bar { display: none; }
    @page { size: A4; margin: 8mm; }
    .sheet { padding: 0; }
  }
</style>
</head>
<body>
<div class="bar">
  <button class="btn btn--small btn--primary" onclick="print()" type="button">인쇄</button>
  <label><input type="checkbox" id="only-night" checked> 야자 신청 학생만</label>
  <p>A4에 8장씩 인쇄됩니다. 학번이 Code 128 바코드로 들어갑니다.</p>
</div>
<div class="sheet" id="sheet"></div>
<script src="vendor/jsbarcode.min.js"></script>
<script src="js/core.js"></script>
<script src="js/store.js"></script>
<script>
(async function () {
  const store = await window.KioskStore.open();
  function draw() {
    const only = document.getElementById('only-night').checked;
    const list = store.state.roster.filter((s) => !only || s.night !== false);
    const sheet = document.getElementById('sheet');
    sheet.innerHTML = '';
    list.forEach((s) => {
      const c = document.createElement('div');
      c.className = 'card';
      c.innerHTML = '<div class="card__top"><span class="card__kind">자기주도학습실 좌석 배정</span><span class="card__demo">시연용</span></div>'
        + '<div><div class="card__name"></div><div class="card__id"></div></div><svg></svg>';
      c.querySelector('.card__name').textContent = s.name;
      c.querySelector('.card__id').textContent = '학번 ' + s.id;
      sheet.appendChild(c);
      JsBarcode(c.querySelector('svg'), s.id, { format: 'CODE128', displayValue: false, margin: 12, height: 60, width: 2.2 });
    });
  }
  document.getElementById('only-night').addEventListener('change', draw);
  draw();
})();
</script>
</body>
</html>
