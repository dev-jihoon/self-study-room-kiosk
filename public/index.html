<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<title>자습실 좌석 배정</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar__title" id="title">자기주도학습실</div>
  <div class="topbar__right">
    <span id="clock" class="topbar__clock"></span>
    <a class="btn btn--small" href="admin.html">감독</a>
  </div>
</header>

<!-- 처음 화면 -->
<section class="screen idle is-active" id="s-idle">
  <div class="idle__main">
    <h1 id="idle-title">학생증을<br>찍어 주세요</h1>
    <p id="idle-sub">바코드가 카메라에 보이게 대 주세요</p>
    <p class="notice" id="notice" hidden></p>
    <button class="btn btn--primary" id="scan-open" type="button">카메라 켜기</button>
  </div>
  <div class="idle__side">
    <div class="idle__side-title">학번으로 할게요</div>
    <div class="idbox is-empty" id="idbox">학번 5자리</div>
    <div class="numpad" id="numpad">
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <button data-k="del" class="key-del">지우기</button><button>0</button><button data-k="ok" class="key-ok" disabled>다음</button>
    </div>
  </div>
</section>

<!-- 바코드 찍기 -->
<section class="screen scan" id="s-scan">
  <h2>바코드를 네모 안에 맞춰 주세요</h2>
  <div class="scan__view" id="camera">
    <video id="video" playsinline muted></video>
    <div class="scan__frame"></div>
  </div>
  <p class="scan__msg" id="scan-msg"></p>
  <div class="btn-row">
    <button class="btn" id="scan-flip" type="button">카메라 바꾸기</button>
    <button class="btn" id="scan-cancel" type="button">취소</button>
  </div>
</section>

<!-- 이미 자리가 있을 때, 운영 시간이 아닐 때 -->
<section class="screen center" id="s-who">
  <div class="center__inner">
    <h2 id="who-title"></h2>
    <p id="who-sub"></p>
    <div class="btn-row" id="who-actions"></div>
    <button class="btn btn--text" id="who-home" type="button">처음으로</button>
  </div>
</section>

<!-- 자리 고르기 -->
<section class="screen pick" id="s-pick">
  <div class="pick__head">
    <div>
      <h2 id="pick-title"></h2>
      <p>흐린 자리는 고를 수 없어요</p>
    </div>
    <button class="btn btn--text" id="pick-cancel" type="button">처음으로</button>
  </div>
  <div class="pick__body" id="pick-map"></div>
</section>

<!-- 끝 -->
<section class="screen center" id="s-done">
  <div class="center__inner">
    <div class="check" aria-hidden="true"></div>
    <h2 id="done-title"></h2>
    <p id="done-sub" hidden></p>
    <div class="done__qr" id="done-qr-box">
      <div class="qr" id="done-qr"></div>
      <p>휴대폰 카메라로 찍으면<br>내 자리를 다시 볼 수 있어요</p>
    </div>
    <div class="btn-row"><button class="btn btn--primary" id="done-ok" type="button">확인</button></div>
    <div class="countdown" id="done-count"></div>
  </div>
</section>

<div class="sheet-wrap" id="sheet">
  <div class="sheet">
    <h3 id="sheet-title"></h3>
    <p id="sheet-sub"></p>
    <div class="btn-row">
      <button class="btn" id="sheet-no" type="button">다른 자리</button>
      <button class="btn btn--primary" id="sheet-yes" type="button">앉을게요</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="vendor/zxing.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="js/core.js"></script>
<script src="js/store.js"></script>
<script src="js/seatmap.js"></script>
<script src="js/scanner.js"></script>
<script src="js/kiosk.js"></script>
</body>
</html>
