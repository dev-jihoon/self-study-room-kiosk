<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자습실 감독 화면</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">
<header class="topbar">
  <div class="topbar__title">자기주도학습실 감독</div>
  <div class="topbar__right">
    <span id="today" class="topbar__date"></span>
    <span id="clock" class="topbar__clock"></span>
    <a class="btn btn--small" href="index.html">키오스크로</a>
  </div>
</header>

<section class="gate" id="gate">
  <h2>감독 PIN을 눌러 주세요</h2>
  <div class="dots" id="dots" aria-live="polite"></div>
  <p class="gate__hint" id="gate-hint"></p>
  <div class="numpad gate__pad" id="pinpad">
    <button type="button">1</button><button type="button">2</button><button type="button">3</button>
    <button type="button">4</button><button type="button">5</button><button type="button">6</button>
    <button type="button">7</button><button type="button">8</button><button type="button">9</button>
    <span></span><button type="button">0</button><button type="button" data-k="del" class="key-del">지우기</button>
  </div>
</section>

<main class="wrap" id="main" hidden>
  <section class="card summary">
    <p class="summary__state" id="run-state"></p>
    <h1 class="summary__title" id="sum-title"></h1>
    <div class="meter"><div class="meter__fill" id="meter"></div></div>
    <div class="summary__links">
      <button type="button" class="link" id="go-absent"></button>
      <span class="summary__extra" id="sum-extra"></span>
    </div>
  </section>

  <nav class="seg-tabs" id="tabs">
    <button data-tab="map" class="is-on" type="button">좌석</button>
    <button data-tab="absent" type="button">안 온 학생</button>
    <button data-tab="stats" type="button">기록</button>
    <button data-tab="settings" type="button">설정</button>
  </nav>

  <!-- 좌석 -->
  <section class="tab is-on" id="t-map">
    <div class="board">
      <div class="card board__map">
        <div class="assign-bar" id="assign-bar" hidden>
          <span id="assign-text"></span>
          <button class="btn btn--small" id="assign-cancel" type="button">취소</button>
        </div>
        <div class="board__canvas" id="map"></div>
      </div>
      <aside class="card side">
        <input class="search" id="search" type="search" placeholder="이름이나 학번으로 찾기" autocomplete="off" aria-label="학생 찾기">
        <ul class="results" id="results"></ul>
        <div id="detail"></div>
        <div id="feed-box">
          <h3 class="side__h">방금 들어온 학생</h3>
          <ol class="feed" id="feed"></ol>
        </div>
      </aside>
    </div>
  </section>

  <!-- 안 온 학생 -->
  <section class="tab" id="t-absent">
    <div class="tab__head">
      <h2 id="absent-title"></h2>
      <p>이름을 누르면 자리를 직접 정해 줄 수 있어요</p>
    </div>
    <div class="classes" id="absent-classes"></div>
    <div class="tab__head tab__head--sub">
      <h2>신청 안 하고 온 학생</h2>
    </div>
    <div class="card"><div class="chips" id="extra-list"></div></div>
  </section>

  <!-- 기록 -->
  <section class="tab" id="t-stats">
    <div class="stats-grid">
      <div class="card">
        <h3 class="card__h">시간대별로 들어온 학생</h3>
        <div class="bars" id="timeline"></div>
      </div>
      <div class="card">
        <h3 class="card__h">반별 출석</h3>
        <ul class="rates" id="class-rates"></ul>
      </div>
    </div>
    <div class="card">
      <div class="card__head">
        <h3 class="card__h">오늘 기록</h3>
        <div class="pills" id="log-filter">
          <button data-f="all" class="is-on" type="button">전체</button>
          <button data-f="assign" type="button">배정</button>
          <button data-f="move" type="button">이동</button>
          <button data-f="release" type="button">반납</button>
        </div>
      </div>
      <ul class="log" id="log"></ul>
    </div>
  </section>

  <!-- 설정 -->
  <section class="tab" id="t-settings">
    <div class="card form">
      <h3 class="card__h">운영</h3>
      <div class="row2">
        <label for="f-start">야자 시작 시각<input type="time" id="f-start"></label>
        <label for="f-end">야자 끝나는 시각<input type="time" id="f-end"></label>
      </div>
      <label class="toggle" for="f-demo"><span>시간과 상관없이 배정받게 하기<small>시연할 때 켜 두세요</small></span><input type="checkbox" id="f-demo"></label>
      <label for="f-hook">배정 알림을 보낼 주소<input type="url" id="f-hook" placeholder="https://"></label>
      <label for="f-public">QR로 열릴 내 자리 주소<input type="url" id="f-public" placeholder="비워 두면 지금 주소를 써요"></label>
      <label for="f-pin">감독 PIN 바꾸기<input type="password" id="f-pin" inputmode="numeric" placeholder="바꿀 때만 입력"></label>
      <button class="btn btn--primary" id="f-save" type="button">저장하기</button>
    </div>

    <div class="card form">
      <h3 class="card__h">학생 명단 <span class="muted" id="roster-count"></span></h3>
      <p class="muted">CSV 파일로 바꿀 수 있어요. 한 줄에 학번,이름,야자신청(1 또는 0)</p>
      <div class="btn-wrap">
        <label class="btn file" for="f-csv">명단 불러오기<input type="file" id="f-csv" accept=".csv,text/csv"></label>
        <button class="btn" id="f-export" type="button">명단 내려받기</button>
        <a class="btn" href="cards.html" target="_blank">시연용 카드 만들기</a>
      </div>
    </div>

    <div class="card form">
      <h3 class="card__h">오늘 자리</h3>
      <div class="btn-wrap">
        <button class="btn" id="f-log-export" type="button">오늘 기록 내려받기</button>
        <button class="btn" id="f-demo-fill" type="button">시연용으로 자리 채우기</button>
        <button class="btn btn--danger" id="f-reset" type="button">모든 자리 비우기</button>
      </div>
    </div>
  </section>
</main>

<div class="sheet-wrap" id="confirm">
  <div class="sheet">
    <h3 id="confirm-title"></h3>
    <p id="confirm-body"></p>
    <div class="btn-row">
      <button class="btn" id="confirm-no" type="button">취소</button>
      <button class="btn btn--primary" id="confirm-yes" type="button">확인</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="js/core.js"></script>
<script src="js/store.js"></script>
<script src="js/seatmap.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
