<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자습실 감독 화면</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">
<header class="topbar">
  <div class="topbar__title">감독 화면</div>
  <div class="topbar__right">
    <span id="mode" class="badge badge--demo"></span>
    <span id="clock" class="topbar__clock"></span>
    <a class="btn btn--small" href="index.html">키오스크로</a>
  </div>
</header>

<section class="gate" id="gate">
  <h2>감독 PIN을 입력하세요</h2>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8">
  <button class="btn btn--primary" id="pin-ok" type="button">들어가기</button>
  <p class="gate__hint" id="gate-hint"></p>
</section>

<main class="admin-main" id="main" hidden>
  <div class="stats">
    <div class="stat"><span>야자 신청</span><b id="st-night"></b></div>
    <div class="stat"><span>입실</span><b id="st-in"></b></div>
    <div class="stat stat--warn"><span>미입실</span><b id="st-absent"></b></div>
    <div class="stat"><span>빈자리</span><b id="st-free"></b></div>
  </div>

  <nav class="tabs" id="tabs">
    <button data-tab="map" class="is-on" type="button">좌석 현황</button>
    <button data-tab="absent" type="button">미입실</button>
    <button data-tab="log" type="button">기록</button>
    <button data-tab="settings" type="button">설정</button>
  </nav>

  <section class="tab is-on" id="t-map">
    <p class="note">자리를 누르면 그 학생의 좌석을 반납 처리할 수 있습니다.</p>
    <div id="map"></div>
  </section>

  <section class="tab" id="t-absent">
    <p class="note">야간자율학습 신청 명단 중 아직 자리를 배정받지 않은 학생입니다.</p>
    <table class="tbl"><thead><tr><th>학번</th><th>이름</th></tr></thead><tbody id="absent"></tbody></table>
  </section>

  <section class="tab" id="t-log">
    <table class="tbl"><thead><tr><th>시각</th><th>구분</th><th>학번</th><th>이름</th><th>좌석</th></tr></thead><tbody id="log"></tbody></table>
  </section>

  <section class="tab" id="t-settings">
    <div class="form">
      <label>야자 시작<input type="time" id="f-start"></label>
      <label>야자 끝<input type="time" id="f-end"></label>
      <label class="check"><input type="checkbox" id="f-demo">시연 모드 (시간과 상관없이 배정 허용)</label>
      <label>알림 웹훅 주소<input type="url" id="f-hook" placeholder="https://… (배정될 때마다 JSON으로 보냄)"></label>
      <label>내 자리 확인 주소<input type="url" id="f-public" placeholder="비워 두면 지금 주소를 씀"></label>
      <label>새 감독 PIN<input type="password" id="f-pin" inputmode="numeric" placeholder="바꿀 때만 입력"></label>
      <div class="form__row"><button class="btn btn--primary btn--small" id="f-save" type="button">설정 저장</button></div>
    </div>

    <h3>명단</h3>
    <p class="note">CSV 형식: 학번,이름,야자신청(1 또는 0). 지금 명단 <b id="roster-count"></b>명.</p>
    <div class="form__row">
      <label class="btn btn--small file">CSV 불러오기<input type="file" id="f-csv" accept=".csv,text/csv"></label>
      <button class="btn btn--small" id="f-export" type="button">명단 내보내기</button>
      <a class="btn btn--small" href="cards.html" target="_blank">시연용 카드 인쇄</a>
    </div>

    <h3>오늘 좌석</h3>
    <div class="form__row">
      <button class="btn btn--small" id="f-log-export" type="button">오늘 기록 내보내기</button>
      <button class="btn btn--small btn--danger" id="f-reset" type="button">모든 좌석 비우기</button>
    </div>
  </section>
</main>

<div class="modal-wrap" id="modal">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <p id="modal-body"></p>
    <div class="actions">
      <button class="btn" id="modal-no" type="button">닫기</button>
      <button class="btn btn--danger" id="modal-yes" type="button">반납 처리</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="js/core.js"></script>
<script src="js/store.js"></script>
<script src="js/seatmap.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
